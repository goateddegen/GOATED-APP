  <!-- Inter (body) + Unbounded (display wordmark, used on cover page) + Space Grotesk (alt headers) -->
  <!-- Non-blocking, Inter only. Unbounded and Space Grotesk were downloaded on
       every visit and are referenced from one page that is not in the nav flow;
       its fallback chain already ends in system-ui. Trimmed from twenty weights
       to the five actually used;
       every extra weight is another font file on a phone. `media="print"` keeps
       it out of the critical path, and the onload handler promotes it once it
       has arrived. Text paints immediately in the system stack and swaps. -->
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" />
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" />
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" />
  </noscript>

  <!-- Critical shell styles, inline so first paint is correct even before the
       app stylesheet lands. Without these the page rendered raw for as long as
       the CSS took — on a slow in-app browser that read as a broken header
       shoved to one side. -->
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0;
      background: #030712; color: #e2e8f0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      /* Nothing should ever scroll sideways on a phone. */
      overflow-x: hidden;
      /* iOS in-app browsers report a viewport taller than the visible area. */
      min-height: 100%;
    }
    *, *::before, *::after { box-sizing: border-box; }
    img, svg, video { max-width: 100%; height: auto; }
    #root { min-height: 100vh; background: #030712; }
    /* Until the app paints, show the background rather than a white flash. */
    #root:empty { background: #030712; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Global error recovery — only fires if React completely fails to mount after 5s
    // Does NOT fire on transient errors (font loading, 3rd party scripts, etc.)
    var _goatedMounted = false;
    window.__goatedMounted = function() { _goatedMounted = true; };
    window.addEventListener('error', function(e) {
      // Ignore non-script errors (images, fonts, stylesheets)
      if (e.target && e.target !== window) return;
      // Ignore errors from external scripts
      if (e.filename && !e.filename.includes(location.hostname) && !e.filename.includes('localhost')) return;
      console.error('[GOATED] Runtime error:', e.message, e.filename, e.lineno);
    });
    // Only show error fallback if React never mounts at all
    setTimeout(function() {
      var root = document.getElementById('root');
      if (!_goatedMounted && root && (!root.hasChildNodes() || root.innerHTML.trim() === '')) {
        root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#030712;color:#94a3b8;font-family:Inter,sans-serif;flex-direction:column;gap:16px"><div style="font-size:48px">🐐</div><div style="font-size:18px;color:white;font-weight:600">GOATED ran into an issue</div><div style="font-size:14px;max-width:400px;text-align:center">Try a hard refresh (Ctrl+Shift+R) or click below to reset.</div><div style="display:flex;gap:12px;margin-top:8px"><button onclick="location.reload()" style="padding:8px 20px;background:#f97316;color:black;border:none;border-radius:8px;font-weight:600;cursor:pointer">Reload</button><button onclick="localStorage.clear();sessionStorage.clear();location.reload()" style="padding:8px 20px;background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:8px;font-weight:600;cursor:pointer">Full Reset</button></div></div>';
      }
    }, 5000);
  </script>
