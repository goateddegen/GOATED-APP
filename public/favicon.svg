<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hornGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="#030712"/>
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="#f97316" stroke-width="0.5" opacity="0.3"/>

  <!-- Left horn -->
  <path d="M18 28 Q14 18 10 8 Q13 12 15 16 Q17 22 18 26 Z" fill="url(#horn)"/>
  <path d="M17 27 Q13 17 9 7" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" filter="url(#hornGlow)" opacity="0.9"/>

  <!-- Right horn -->
  <path d="M46 28 Q50 18 54 8 Q51 12 49 16 Q47 22 46 26 Z" fill="url(#horn)"/>
  <path d="M47 27 Q51 17 55 7" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" filter="url(#hornGlow)" opacity="0.9"/>

  <!-- Body / head -->
  <ellipse cx="32" cy="36" rx="17" ry="19" fill="url(#body)" stroke="rgba(16,185,129,0.15)" stroke-width="0.8"/>

  <!-- Ears -->
  <ellipse cx="17" cy="30" rx="3.5" ry="6" fill="url(#body)" transform="rotate(-15 17 30)" stroke="rgba(16,185,129,0.1)" stroke-width="0.3"/>
  <ellipse cx="47" cy="30" rx="3.5" ry="6" fill="url(#body)" transform="rotate(15 47 30)" stroke="rgba(16,185,129,0.1)" stroke-width="0.3"/>

  <!-- Eye sockets -->
  <ellipse cx="25" cy="34" rx="3.5" ry="4" fill="#020617"/>
  <ellipse cx="39" cy="34" rx="3.5" ry="4" fill="#020617"/>

  <!-- Eyes (neon green) -->
  <ellipse cx="25" cy="34" rx="2" ry="2.5" fill="url(#eye)" filter="url(#glow)"/>
  <ellipse cx="39" cy="34" rx="2" ry="2.5" fill="url(#eye)" filter="url(#glow)"/>

  <!-- Eye highlights -->
  <circle cx="24" cy="33" r="0.8" fill="#fff" opacity="0.9"/>
  <circle cx="38" cy="33" r="0.8" fill="#fff" opacity="0.9"/>

  <!-- Snout -->
  <ellipse cx="32" cy="44" rx="7" ry="6" fill="#020617" stroke="rgba(16,185,129,0.08)" stroke-width="0.3"/>

  <!-- Nostrils -->
  <ellipse cx="29" cy="45" rx="1" ry="0.8" fill="rgba(16,185,129,0.3)"/>
  <ellipse cx="35" cy="45" rx="1" ry="0.8" fill="rgba(16,185,129,0.3)"/>

  <!-- Mouth smirk -->
  <path d="M27 49 Q32 52 37 48" fill="none" stroke="rgba(16,185,129,0.25)" stroke-width="0.8" stroke-linecap="round"/>
</svg>
