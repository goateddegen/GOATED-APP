<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="GOATED Solutions">
  <title>GOATED Solutions</title>
  <!--
    Static 2D export of the GOATED mark (src/components/GoatLogo.jsx).
    All SMIL animation, interactive eye-tracking and floating particles are
    stripped — glyphs are frozen at their resting state so the file renders
    identically in LinkedIn, print, and any rasteriser.
    Degen palette (orange) to match the live cover page.
  -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Orbit rings, frozen mid-sweep -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#ringGrad)" stroke-width="0.5" opacity="0.4"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" filter="url(#glow)" opacity="0.5" stroke-dasharray="300,300"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#ringGrad)" stroke-width="0.8" opacity="0.25" stroke-dasharray="300,300"/>

  <!-- Head -->
  <ellipse cx="100" cy="108" rx="52" ry="56" fill="url(#bodyGrad)" stroke="rgba(249,115,22,0.15)" stroke-width="1.5"/>
  <ellipse cx="100" cy="108" rx="52" ry="56" fill="none" stroke="url(#ringGrad)" stroke-width="0.5" opacity="0.3" filter="url(#softGlow)"/>

  <!-- Horns -->
  <path d="M58 82 Q48 50 35 28 Q42 35 48 42 Q54 58 58 74 Z" fill="url(#hornGrad)"/>
  <path d="M56 80 Q46 48 33 26" fill="none" stroke="#fb923c" stroke-width="2.5" filter="url(#heavyGlow)" opacity="0.9"/>
  <path d="M142 82 Q152 50 165 28 Q158 35 152 42 Q146 58 142 74 Z" fill="url(#hornGrad)"/>
  <path d="M144 80 Q154 48 167 26" fill="none" stroke="#fb923c" stroke-width="2.5" filter="url(#heavyGlow)" opacity="0.9"/>

  <!-- Ears -->
  <ellipse cx="56" cy="88" rx="10" ry="18" fill="url(#bodyGrad)" transform="rotate(-15 56 88)" stroke="rgba(249,115,22,0.1)" stroke-width="0.5"/>
  <ellipse cx="144" cy="88" rx="10" ry="18" fill="url(#bodyGrad)" transform="rotate(15 144 88)" stroke="rgba(249,115,22,0.1)" stroke-width="0.5"/>

  <!-- Snout -->
  <ellipse cx="100" cy="130" rx="22" ry="18" fill="#030712" stroke="rgba(249,115,22,0.08)" stroke-width="0.5"/>

  <!-- Eyes, resting forward -->
  <ellipse cx="78" cy="102" rx="10" ry="12" fill="#020617"/>
  <ellipse cx="122" cy="102" rx="10" ry="12" fill="#020617"/>
  <ellipse cx="78" cy="102" rx="5.5" ry="7" fill="url(#eyeGlow)" filter="url(#heavyGlow)"/>
  <ellipse cx="122" cy="102" rx="5.5" ry="7" fill="url(#eyeGlow)" filter="url(#heavyGlow)"/>
  <circle cx="76" cy="100" r="2.5" fill="#fff" opacity="0.95"/>
  <circle cx="120" cy="100" r="2.5" fill="#fff" opacity="0.95"/>
  <circle cx="80" cy="104" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="124" cy="104" r="1" fill="#fff" opacity="0.5"/>

  <!-- Nostrils + smirk -->
  <ellipse cx="92" cy="135" rx="3" ry="2.5" fill="rgba(249,115,22,0.25)"/>
  <ellipse cx="108" cy="135" rx="3" ry="2.5" fill="rgba(249,115,22,0.25)"/>
  <path d="M86 145 Q100 155 114 143" fill="none" stroke="rgba(249,115,22,0.25)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Crown sparkle, drawn as a path so it needs no font -->
  <path d="M100 51 L102.2 57.2 L108.4 59.4 L102.2 61.6 L100 67.8 L97.8 61.6 L91.6 59.4 L97.8 57.2 Z"
        fill="#fb923c" opacity="0.85" filter="url(#glow)"/>
</svg>
